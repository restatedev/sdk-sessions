# A release: the push of a tag v<version> (created with
# .tools/prepare-release.sh, which bumps every published package to that
# version, commits and tags). It checks that the packages carry the tag's
# version, runs the repository's checks and builds the packages on the tagged
# commit (checks.yml, packages.yml: the addon for every platform, then every
# package packed and installed on each), publishes those tarballs to npm, and
# creates the GitHub release with generated notes.
#
# To retry a failed run, re-run its failed jobs, or dispatch this workflow on
# the tag: packages already on npm are skipped.
#
# npm trusted publishing is bound to this file's name: don't rename it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag's version, which every published package must carry, and the npm
  # dist-tag it publishes under.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The published packages: every package.json of the workspace without `private`.
          PUBLISHED=0
          for pkg in packages/*/package.json packages/sessions/npm/*/package.json; do
            if [ "$(jq -r '.private // false' "$pkg")" = true ]; then continue; fi
            PUBLISHED=$((PUBLISHED + 1))
            PKG_VERSION=$(jq -r '.version' "$pkg")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::$pkg has version $PKG_VERSION, expected $VERSION. Create the release tag with .tools/prepare-release.sh"
              exit 1
            fi
          done
          if [ "$PUBLISHED" = 0 ]; then
            echo "::error::No package to publish: every package.json is private"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            # A pre-release (0.3.0-rc.1, 0.3.0-alpha.0) must not be published under the
            # `latest` dist-tag (the default), or a plain install would get it: its
            # identifier (rc, alpha, beta, ...) is the dist-tag.
            PRERELEASE_ID="${VERSION#*-}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=${PRERELEASE_ID%%.*}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

          # Releasing an older line (a backport) must not move `latest` backwards. The
          # first release finds no package on npm, and is `latest`.
          NAME=$(jq -r '.name' packages/sessions/package.json)
          LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          else
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            echo "npm_tag=release-$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # The tarballs to publish, built and installed on every platform: the run's
  # `packages` artifact.
  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read

  release:
    needs: [version, checks, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages-out
      # The tarballs as tested, not rebuilt. Each is published with provenance
      # through npm trusted publishing (no token): a package already on npm at
      # this version is skipped, so a run can be retried.
      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          for tarball in packages-out/*.tgz; do
            NAME=$(tar -xOf "$tarball" package/package.json | jq -r '.name')
            VERSION=$(tar -xOf "$tarball" package/package.json | jq -r '.version')
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
              echo "$NAME@$VERSION is on npm already, skipped"
              continue
            fi
            npm publish "$tarball" --tag "$NPM_TAG" --access public --provenance
          done
          echo "Published \`${{ needs.version.outputs.version }}\` with dist-tag \`$NPM_TAG\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already"
            exit 0
          fi
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          if [ "$NPM_TAG" != latest ]; then FLAGS+=(--latest=false); fi
          gh release create "$TAG" --title "Release $TAG" --generate-notes --verify-tag "${FLAGS[@]}"
