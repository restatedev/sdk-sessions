# The repository's checks, as a contributor runs them at the root: `pnpm lint`
# (types, oxlint, oxfmt, rustfmt, clippy) and `pnpm test` (every package's
# tests, then the addon's Rust tests); and the end-to-end tests against a
# real Restate server (packages/e2e). A pull request merges once they pass,
# and a release runs them on its tag (release.yml).
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint, and the TypeScript tests over this runner's addon (`pnpm build`).
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sessions/native
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm -r --workspace-concurrency=1 test
      # Against the Restate server @restatedev/restate-server installs: the
      # promise selector (which pins the SDK), Restate's agent tools, and the
      # agents and sessions through crashes.
      - run: pnpm --filter e2e concurrency
      - run: pnpm --filter e2e tools
      - run: pnpm --filter e2e crash
      # A failed crash run keeps its services' and the server's logs.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/restate-sessions-examples-*
          if-no-files-found: ignore

  # The addon's Rust tests (`pnpm --filter @restatedev/sessions test:rust`).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sessions/native
      - run: cargo test --locked --release --manifest-path packages/sessions/native/Cargo.toml
