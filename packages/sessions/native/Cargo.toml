[package]
name = "restate-sessions"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Node.js addon of @restatedev/sessions: an object's SQLite-compatible database, kept in its Restate state"

# Its own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3"
# The storage (`state`) and SQL on it (`sql`), with its feature `sql`, and
# checkpoints' packs in the object store RESTATE_SQL_OBJECT_STORE names
# (`state::ObjectStoreL1`): S3, GCS or Azure, with their features, or a
# directory.
# This is sdk-shared-core's main at the commit of sdk-shared-core#120 (a
# cancellation resumes an invocation shut down while it waits for a call). Go
# back to a version at the next shared-core release.
restate-sdk-shared-core = { git = "https://github.com/restatedev/sdk-shared-core", rev = "b15c9724cde752ff6f563c815e6da7dbc26a55e5", features = [
  "sql",
  "object_store_aws",
  "object_store_gcp",
  "object_store_azure",
  # Verifying a request's signature, which this package must do itself: it
  # runs a session object's invocation ahead of the SDK's handler, where the
  # SDK would have verified it (`src/endpoint.ts`).
  "request_identity",
  "rust_crypto",
] }
futures = "0.3"
bytes = "1.10"

[lints.rust]
# Public is what the crate root exports; anything else says how far it reaches.
unreachable_pub = "warn"

[build-dependencies]
napi-build = "2"

[profile.dev]
debug = 0

# The addon a package ships (pnpm build:dist): smaller (18 MB, not 28) and
# whole-program optimized, at minutes more to build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
