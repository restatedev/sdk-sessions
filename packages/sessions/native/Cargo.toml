[package]
name = "restate-sessions"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Node.js addon of @restatedev/sessions: an object's SQLite-compatible database, kept in its Restate state"

# Its own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3"
# The storage (`state`) and SQL on it (`sql`), with its feature `sql`.
restate-sdk-shared-core = { version = "8.4.0", features = ["sql"] }
futures = "0.3"
bytes = "1.10"

[lints.rust]
# Public is what the crate root exports; anything else says how far it reaches.
unreachable_pub = "warn"

[build-dependencies]
napi-build = "2"

[profile.dev]
debug = 0

# The addon a package ships (pnpm build:dist): smaller (18 MB, not 28) and
# whole-program optimized, at minutes more to build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
